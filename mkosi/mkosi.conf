[Distribution]
Distribution=fedora
Release=44

[Output]
Format=disk
OutputDirectory=mkosi.output
#ImageId=aspp

[Build]
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=44
WorkspaceDirectory=../mkosi.workspace
CacheDirectory=mkosi.cache
WithNetwork=yes

[Runtime]

[Content]
# Hostname=aspp
Bootable=yes
UnifiedKernelImages=no

KernelCommandLine=
        selinux=0
        audit=0

FirmwareFiles=*

Packages=
        systemd-udev
        systemd-boot
#       systemd-ukify

        kernel
        kernel-core
        @core
        @standard
        @headless-management

        systemd-pam

        cracklib-dicts # needed so that passwd works

        git
        ansible
        vim-enhanced
        tmux

        # NetworkManager additions

        NetworkManager
        NetworkManager-bluetooth
        NetworkManager-config-connectivity-fedora
        NetworkManager-wifi
        nm-connection-editor

        # rpmfusion
        https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%r.noarch.rpm
        https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%r.noarch.rpm

        # Build dependencies

        @c-development
        meson
        python
        python3
        python-unversioned-command

        # Firmware

        b43-fwcutter
        alsa-firmware
        alsa-sof-firmware
        alsa-tools-firmware
        linux-firmware
        atmel-firmware
        iw*-firmware
        zd*-firmware
        realtek-firmware
