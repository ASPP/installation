---
- name: ssh | Disable password logins
  tags: user-creation
  ansible.builtin.copy:
    content: |
      PasswordAuthentication no

    dest: /etc/ssh/sshd_config.d/80-password-auth.conf
    mode: "0644"
  notify: Reload sshd config

- name: firefox | Create firefox policies directory
  tags: config
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"

- name: firefox | Setup firefox policies
  tags: config
  ansible.builtin.copy:
    dest: /etc/firefox/policies/policies.json
    mode: "0644"
    # ManagedBookmarks is the recommended option but only generates a folder
    # Bookmarks just sets all bookmarks
    src: firefox-policies.json

- name: config | Set timezone
  tags: config
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Add English langpack
  tags: packages
  ansible.builtin.dnf:
    name: glibc-langpack-en

- name: config | Set language to English
  tags: config
  ansible.builtin.copy:
    content: |
      LANG=en_US.UTF-8
    dest: /etc/locale.conf
    mode: "0644"

- name: Add avahi ssh configuration
  tags: config
  ansible.builtin.copy:
    src: /usr/share/doc/avahi/ssh.service
    dest: /etc/avahi/services/ssh.service
    remote_src: yes

- name: firewall | add local network to internal zone
  # TODO: Change for every location
  ansible.posix.firewalld:
    source: 10.9.6.0/22
    permanent: true
    state: enabled

- name: firewall | permit pelita port in internal zone
  ansible.posix.firewalld:
    port: 41736/tcp
    permanent: true
    state: enabled
